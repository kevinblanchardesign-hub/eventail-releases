# Publishes the Eventail website (folder site/ of the private code
# repository) on Cloudflare Pages, for free.
#   - main            → the real site (production)
#   - any other branch → a preview address, to check before merging
# Started by a push that changes site-request.txt (first line "ref=<branch>")
# or by "Run workflow".
#
# Secrets: CODE_TOKEN (read the code), CLOUDFLARE_API_TOKEN (Cloudflare
# Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.

name: Site

on:
  push:
    branches: [main]
    paths: [site-request.txt]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the code repository to publish"
        required: false
        default: "main"

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read

env:
  CODE_REPO: kevinblanchardesign-hub/eventail
  PROJECT: eventail

jobs:
  deploy:
    name: Publish the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read the request
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          sparse-checkout: site-request.txt
          sparse-checkout-cone-mode: false

      - name: Choose the branch
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          REF="$INPUT_REF"
          if [ -z "$REF" ] && [ -f site-request.txt ]; then
            REF=$(sed -n 's/^ref=//p' site-request.txt | head -n 1)
          fi
          REF=${REF:-main}
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if [ "$REF" = "main" ]; then echo "branch=main" >> "$GITHUB_OUTPUT"; else echo "branch=preview" >> "$GITHUB_OUTPUT"; fi

      - name: Check out the code
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CODE_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.CODE_TOKEN }}
          path: code

      - name: Build the site
        run: |
          sudo apt-get install -y -q librsvg2-bin > /dev/null
          bash code/scripts/build-site.sh "$PWD/dist"

      - name: Publish on Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ steps.ref.outputs.branch }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
          # The project is created the first time.
          if ! npx --yes wrangler@4 pages project list 2>/dev/null | grep -q " $PROJECT "; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || true
          fi
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch "$BRANCH" \
            --commit-dirty=true | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)
          echo "### Site published: $URL" >> "$GITHUB_STEP_SUMMARY"
